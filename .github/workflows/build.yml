name: build
on:
  push:
  workflow_dispatch:
jobs:
  engine-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Static offline checks
        run: node test/offline.test.mjs
      - name: Conversion matrix with no network at all
        run: sudo unshare -n env "PATH=$PATH" node test/engine.test.mjs

  e2e-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev ffmpeg imagemagick xvfb scrot
      - run: npm install
      - run: npx tauri icon assets/icon.png
      - name: Rust tests (real engine, file safety)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the real app
        run: npx tauri build --debug --no-bundle
      - name: Run the real app and convert a file through its wheel
        run: |
          mkdir -p e2e && cd e2e
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=320x240:rate=15:duration=2 -f lavfi -i sine=frequency=440:duration=2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac birthday.mov
          sha256sum birthday.mov > before.sha
          export BRIXALO_E2E_FILE="$PWD/birthday.mov" BRIXALO_E2E_TO=webm BRIXALO_E2E_DELAY_MS=16000
          xvfb-run -a -s "-screen 0 1000x700x24" bash -c '
            ../src-tauri/target/debug/brixalo > app.log 2>&1 &
            APP=$!
            sleep 10; scrot 1-wheel-open.png; sleep 3; scrot 1b-wheel-open.png
            for i in $(seq 1 40); do [ -f birthday.webm ] && break; sleep 1; done
            sleep 2; scrot 2-after-click.png
            kill $APP || true'
          ls -la
          test -s birthday.webm
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration -of default=nw=1 birthday.webm | tee probe.txt
          grep -q vp9 probe.txt
          sha256sum -c before.sha
          ! ls -a | grep -q '\.part\.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-evidence
          path: |
            e2e/*.png
            e2e/*.webm
            e2e/probe.txt
            e2e/app.log

  glass-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb scrot picom feh imagemagick x11-utils x11-apps
      - run: npm install
      - run: npx tauri icon assets/icon.png
      - run: npx tauri build --debug --no-bundle
      - name: Glass proof (real app over a colourful backdrop with a compositor)
        run: |
          mkdir -p glass && cd glass
          convert -size 1000x700 plasma:fractal -blur 0x2 bg.png
          convert bg.png -fill '#ff2d95' -draw 'rectangle 40,420 360,660' -fill '#00e5ff' -draw 'circle 760,520 760,640' -fill '#ffe600' -draw 'rectangle 600,40 960,160' bg.png
          xvfb-run -a -s "-screen 0 1000x700x24 +extension Composite +extension RENDER" bash ../test/glass-proof.sh > run.log 2>&1 || true
          ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-proof
          path: glass/*

  installers:
    needs: [engine-test, e2e-linux]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm install
      - run: npx tauri icon assets/icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: brixalo-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
