<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brixalo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <header>
    <div class="brand"><span>Brixalo</span></div>
    <div class="tools"><div class="engine" id="engine">checking engine...</div><button id="settings-open" class="secondary" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settings-dialog" aria-describedby="settings-hint"><span id="settings-hint" role="tooltip">Settings</span><svg class="settings-gear" viewBox="0 0 32 32" aria-hidden="true"><path d="M13.412,6.341 L14.436,6.123 L14.438,3.094 L17.562,3.094 L17.564,6.123 L18.588,6.341 L18.588,6.341 L19.584,6.664 L21.1,4.042 L23.805,5.604 L22.293,8.229 L23.071,8.929 L23.071,8.929 L23.771,9.707 L26.396,8.195 L27.958,10.9 L25.336,12.416 L25.659,13.412 L25.659,13.412 L25.877,14.436 L28.906,14.438 L28.906,17.562 L25.877,17.564 L25.659,18.588 L25.659,18.588 L25.336,19.584 L27.958,21.1 L26.396,23.805 L23.771,22.293 L23.071,23.071 L23.071,23.071 L22.293,23.771 L23.805,26.396 L21.1,27.958 L19.584,25.336 L18.588,25.659 L18.588,25.659 L17.564,25.877 L17.562,28.906 L14.438,28.906 L14.436,25.877 L13.412,25.659 L13.412,25.659 L12.416,25.336 L10.9,27.958 L8.195,26.396 L9.707,23.771 L8.929,23.071 L8.929,23.071 L8.229,22.293 L5.604,23.805 L4.042,21.1 L6.664,19.584 L6.341,18.588 L6.341,18.588 L6.123,17.564 L3.094,17.562 L3.094,14.438 L6.123,14.436 L6.341,13.412 L6.341,13.412 L6.664,12.416 L4.042,10.9 L5.604,8.195 L8.229,9.707 L8.929,8.929 L8.929,8.929 L9.707,8.229 L8.195,5.604 L10.9,4.042 L12.416,6.664 L13.412,6.341 Z M16 11 A5 5 0 1 0 16 21 A5 5 0 1 0 16 11Z" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width=".7" stroke-linejoin="round"/></svg></button></div>
  </header>
  <section id="drop">
    <div class="drop-card">
      <h1>Drop a <em>file</em> here</h1>
      <p>The conversion wheel opens right under your cursor. <kbd>Esc</kbd> closes it.</p>
      <button id="pick" type="button">Choose a file</button>
      <button id="inspect-pick" class="secondary" type="button">Inspect quality / all formats</button>
      <div><button id="view-pick" class="secondary" type="button">View a file</button> <button id="byte-tool" class="secondary" type="button">Text / binary / hex</button> <button id="crypto-tool" class="secondary" type="button">Encrypt / decrypt</button> <button id="decoder-tool" class="secondary" type="button">Decode workbench</button></div><p class="small">Local only. No ads, accounts or uploads.</p>
    </div>
  </section>
  <a class="small" href="THIRD_PARTY_LICENSES.txt" target="_blank" rel="noopener">Third-party licences (age)</a>
  <section id="jobs" aria-live="polite"></section>
</main>
<div id="wheel-layer" hidden></div>
<dialog id="decoder-dialog" aria-label="Decode workbench"><button id="close-decoder">Close</button><div id="decoder-body"></div></dialog>
<dialog id="crypto-dialog" aria-label="File encryption"><button id="close-crypto">Close</button><div id="crypto-body"></div></dialog>
<dialog id="viewer-dialog" aria-label="Local file viewer"><button id="close-viewer" type="button">Close</button><div id="viewer-body"></div></dialog>
<dialog id="conversion-dialog" aria-label="Inspect and convert"><button id="close-conversion" type="button" aria-label="Close conversion settings">Close</button><div id="conversion-body"></div></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><button id="settings-close" class="secondary" type="button">Close</button><div class="eyebrow">PREFERENCES</div><h2 id="settings-title">Appearance</h2><p class="muted">Changes are saved on this device.</p><div class="themes" role="group" aria-label="Theme"></div><div class="glassbar" id="glassbar"><label>Background <input id="alpha" type="range" min="20" max="95" aria-label="Background opacity"><output id="alpha-value">50%</output></label><label>Foreground <input id="foreground" type="range" min="70" max="100" aria-label="Foreground opacity"><output id="foreground-value">100%</output></label></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
